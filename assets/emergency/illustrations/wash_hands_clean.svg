<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="200" cy="270" rx="140" ry="14" fill="#ECEFF1"/>

  <!-- Water tap/faucet -->
  <path d="M 120 40 L 195 40 C 210 40 220 50 220 65 L 220 95 L 200 95 L 200 65 C 200 60 195 55 190 55 L 120 55 Z" fill="#78909C"/>
  <rect x="195" y="90" width="30" height="12" rx="3" fill="#90A4AE"/>
  <ellipse cx="210" cy="48" rx="8" ry="12" fill="#546E7A"/>
  
  <!-- Clear water stream -->
  <path d="M 202 102 L 198 250 L 222 250 L 218 102 Z" fill="#81D4FA" opacity="0.8"/>
  <path d="M 206 102 L 204 250 L 214 250 L 212 102 Z" fill="#E1F5FE" opacity="0.9"/>
  
  <!-- Two Hands Lathering with Soap -->
  <g transform="translate(60, 40)">
    <!-- Right Hand -->
    <path d="M 70 145 C 90 135 120 125 145 135 C 160 142 165 160 155 175 C 140 185 110 180 80 170 Z" fill="#FFE0B2"/>
    <!-- Right Fingers -->
    <path d="M 145 135 Q 165 130 175 140 Q 165 155 150 155 Z" fill="#FFCC80"/>
    <path d="M 148 145 Q 170 142 178 152 Q 168 165 152 162 Z" fill="#FFCC80"/>
    <path d="M 145 155 Q 165 155 172 165 Q 160 175 145 170 Z" fill="#FFCC80"/>
    
    <!-- Left Hand Interlocked / Rubbing Palms -->
    <path d="M 120 115 C 140 115 155 125 150 145 C 145 165 125 175 105 165 C 95 155 100 130 120 115 Z" fill="#FFCC80"/>
    <path d="M 100 120 Q 90 100 105 95 Q 120 105 115 125 Z" fill="#FFE0B2"/> <!-- Thumb -->
    
    <!-- Soap lather / White foam bubbles -->
    <ellipse cx="135" cy="145" rx="20" ry="14" fill="#FFFFFF" opacity="0.9" stroke="#E0F7FA" stroke-width="1.5"/>
    <circle cx="115" cy="135" r="7" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1.5"/>
    <circle cx="155" cy="130" r="6" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1.5"/>
    <circle cx="140" cy="165" r="8" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1.5"/>
    <circle cx="165" cy="155" r="5" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1.5"/>
    <circle cx="110" cy="155" r="6" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1.5"/>
    
    <!-- Water Splashes -->
    <path d="M 95 175 Q 85 185 80 180" stroke="#03A9F4" stroke-width="2" fill="none"/>
    <path d="M 185 170 Q 195 180 200 170" stroke="#03A9F4" stroke-width="2" fill="none"/>
  </g>
  
  <rect x="20" y="18" width="185" height="26" rx="13" fill="#E8F5E9"/>
  <text x="112" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2E7D32" text-anchor="middle">Wash Hands Thoroughly</text>
</svg>
