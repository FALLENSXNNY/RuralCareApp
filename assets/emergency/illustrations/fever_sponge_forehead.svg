<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="200" cy="265" rx="150" ry="15" fill="#ECEFF1"/>

  <g transform="translate(30, 40)">
    <!-- Pillow -->
    <path d="M 40 160 C 20 160 20 190 40 200 L 160 200 C 180 200 180 170 160 160 Z" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>
    
    <!-- Child/Person resting on pillow -->
    <!-- Head -->
    <ellipse cx="110" cy="155" rx="42" ry="38" fill="#FFE0B2"/>
    <!-- Hair -->
    <path d="M 68 150 C 68 120 90 115 120 115 C 145 115 155 130 152 150 C 140 135 125 130 110 132 C 90 134 75 142 68 150 Z" fill="#455A64"/>
    
    <!-- Closed peaceful eyes -->
    <path d="M 115 155 Q 123 162 130 155" stroke="#78909C" stroke-width="2" fill="none"/>
    <!-- Soft blush (warm fever) -->
    <ellipse cx="125" cy="165" rx="8" ry="5" fill="#FF8A80" opacity="0.4"/>
    
    <!-- Blanket covering body -->
    <path d="M 125 180 C 150 170 200 165 290 180 L 285 220 L 110 220 Z" fill="#90CAF9"/>
    
    <!-- Bowl of lukewarm tepid water -->
    <g transform="translate(220, 110)">
      <ellipse cx="40" cy="50" rx="35" ry="10" fill="#B0BEC5"/>
      <path d="M 5 50 C 5 75 20 90 40 90 C 60 90 75 75 75 50 Z" fill="#CFD8DC" stroke="#B0BEC5" stroke-width="2"/>
      <ellipse cx="40" cy="52" rx="30" ry="7" fill="#4FC3F7"/>
      <!-- Water ripple -->
      <ellipse cx="40" cy="52" rx="18" ry="4" fill="none" stroke="#E1F5FE" stroke-width="1.5"/>
    </g>
    
    <!-- Caring Hand holding folded damp cloth on forehead -->
    <g transform="translate(80, 50)">
      <!-- Rescuer Hand -->
      <path d="M 70 10 C 60 10 50 30 45 50 C 40 70 45 75 55 75 L 85 75 C 95 75 95 50 90 30 C 85 15 80 10 70 10 Z" fill="#FFCC80"/>
      <!-- Folded damp white/blue cloth -->
      <rect x="25" y="70" width="55" height="18" rx="6" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
      <line x1="30" y1="78" x2="75" y2="78" stroke="#81D4FA" stroke-width="1.5"/>
      
      <!-- Gentle motion arrows -->
      <path d="M 20 65 Q 15 75 20 85" stroke="#0288D1" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Water drops -->
      <circle cx="85" cy="85" r="2.5" fill="#0288D1"/>
    </g>
  </g>

  <rect x="20" y="18" width="160" height="26" rx="13" fill="#E1F5FE"/>
  <text x="100" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0288D1" text-anchor="middle">Tepid Water Sponging</text>
</svg>
