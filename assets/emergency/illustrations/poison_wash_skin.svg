<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="200" cy="270" rx="150" ry="15" fill="#ECEFF1"/>

  <!-- Water tap/faucet -->
  <path d="M 120 40 L 190 40 C 205 40 215 50 215 65 L 215 95 L 195 95 L 195 65 C 195 60 190 55 185 55 L 120 55 Z" fill="#78909C"/>
  <rect x="190" y="90" width="30" height="12" rx="3" fill="#90A4AE"/>
  <ellipse cx="205" cy="48" rx="8" ry="12" fill="#546E7A"/>
  
  <!-- Abundant running water stream -->
  <path d="M 197 102 L 193 250 L 217 250 L 213 102 Z" fill="#81D4FA" opacity="0.8"/>
  <path d="M 201 102 L 199 250 L 209 250 L 207 102 Z" fill="#E1F5FE" opacity="0.9"/>
  
  <!-- Forearm & hands under water -->
  <g transform="translate(60, 40)">
    <!-- Right arm extending in -->
    <path d="M 10 145 C 50 145 90 140 130 135 C 150 132 170 135 185 140 L 180 160 C 160 155 140 155 120 160 C 80 168 40 170 10 170 Z" fill="#FFE0B2"/>
    
    <!-- Left hand rubbing & washing with soap -->
    <path d="M 120 115 C 135 115 150 120 160 130 L 145 155 C 135 145 125 140 115 140 Z" fill="#FFCC80"/>
    <ellipse cx="145" cy="140" rx="14" ry="10" fill="#FFE0B2"/>
    
    <!-- Soap bar -->
    <rect x="130" y="105" width="28" height="16" rx="6" fill="#80CBC4" stroke="#00897B" stroke-width="1.5"/>
    <ellipse cx="144" cy="113" rx="10" ry="4" fill="#E0F2F1"/>
    
    <!-- Soap Bubbles -->
    <circle cx="125" cy="128" r="6" fill="#E0F7FA" stroke="#4DD0E1" stroke-width="1.5"/>
    <circle cx="160" cy="120" r="5" fill="#E0F7FA" stroke="#4DD0E1" stroke-width="1.5"/>
    <circle cx="140" cy="155" r="7" fill="#E0F7FA" stroke="#4DD0E1" stroke-width="1.5"/>
    <circle cx="170" cy="145" r="4" fill="#E0F7FA" stroke="#4DD0E1" stroke-width="1.5"/>
    
    <!-- Water Splashes -->
    <path d="M 115 170 Q 105 180 100 175" stroke="#03A9F4" stroke-width="2" fill="none"/>
    <path d="M 180 165 Q 195 175 200 165" stroke="#03A9F4" stroke-width="2" fill="none"/>
  </g>
  
  <rect x="20" y="18" width="160" height="26" rx="13" fill="#E0F2F1"/>
  <text x="100" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00796B" text-anchor="middle">Wash with Soap &amp; Water</text>
</svg>
