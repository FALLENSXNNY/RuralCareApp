<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="200" cy="260" rx="160" ry="16" fill="#ECEFF1"/>
  
  <!-- Person resting -->
  <g transform="translate(40, 70)">
    <!-- Body/bed base -->
    <path d="M 40 160 Q 160 175 280 160 L 280 180 L 40 180 Z" fill="#CFD8DC"/>
    <path d="M 20 150 C 20 130 50 120 70 145 L 80 160 L 20 160 Z" fill="#90CAF9"/>
    
    <!-- Torso in light blue shirt -->
    <path d="M 75 140 C 95 115 150 115 190 130 C 220 142 245 155 270 155 L 265 170 L 70 170 Z" fill="#BBDEFB"/>
    
    <!-- Head and neck on pillow -->
    <path d="M 25 125 C 25 105 45 95 65 95 C 75 95 85 105 85 120 C 85 135 65 145 45 145 Z" fill="#FFE0B2"/>
    <path d="M 15 130 Q 5 130 5 150 Q 50 160 80 155 Z" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="2"/>
    
    <!-- Hair -->
    <path d="M 35 95 C 45 90 65 90 70 98 C 60 102 55 110 50 115 C 40 110 30 110 35 95 Z" fill="#455A64"/>
    
    <!-- Face profile & closed eyes -->
    <circle cx="68" cy="115" r="2" fill="#78909C"/>
    <path d="M 64 122 Q 68 125 72 122" stroke="#78909C" stroke-width="1.5" fill="none"/>
    
    <!-- Wet Cooling Cloth on Forehead -->
    <rect x="52" y="100" width="26" height="12" rx="4" fill="#03A9F4"/>
    <path d="M 54 103 Q 65 98 76 103" stroke="#E1F5FE" stroke-width="1.5" fill="none"/>
    
    <!-- Wet Cloth on Neck -->
    <rect x="75" y="125" width="18" height="10" rx="3" fill="#03A9F4"/>
    
    <!-- Cooling Cloth under Armpit -->
    <rect x="110" y="130" width="22" height="12" rx="4" fill="#03A9F4"/>
    
    <!-- Cooling breeze / evaporation indicators -->
    <path d="M 180 60 Q 200 70 220 60 Q 240 50 260 60" fill="none" stroke="#29B6F6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
    <path d="M 190 75 Q 210 85 230 75 Q 250 65 270 75" fill="none" stroke="#4FC3F7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,4"/>
    <path d="M 200 90 Q 220 100 240 90 Q 260 80 280 90" fill="none" stroke="#81D4FA" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>
    
    <!-- Water Droplets -->
    <path d="M 65 75 C 65 70 70 65 70 65 C 70 65 75 70 75 75 C 75 78 73 80 70 80 C 67 80 65 78 65 75 Z" fill="#0288D1"/>
    <path d="M 120 90 C 120 86 124 82 124 82 C 124 82 128 86 128 90 C 128 92 126 94 124 94 C 122 94 120 92 120 90 Z" fill="#0288D1"/>
  </g>
  
  <!-- Badge/Label in corner -->
  <rect x="20" y="18" width="140" height="26" rx="13" fill="#E1F5FE"/>
  <text x="90" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0288D1" text-anchor="middle">Cool Wet Cloths</text>
</svg>
