<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="200" cy="265" rx="160" ry="16" fill="#ECEFF1"/>

  <!-- Fallen victim on right -->
  <g transform="translate(180, 140)">
    <ellipse cx="140" cy="80" rx="18" ry="16" fill="#FFE0B2"/>
    <path d="M 40 85 C 60 70 100 70 125 80 L 130 95 L 35 95 Z" fill="#90CAF9"/>
    <!-- Fallen electrical wire -->
    <path d="M -10 65 Q 40 90 90 70 Q 140 50 170 85" stroke="#D32F2F" stroke-width="4" fill="none"/>
    <!-- Electric spark caution -->
    <path d="M 85 55 L 90 65 L 82 67 L 92 78 L 86 68 L 94 66 Z" fill="#FBC02D" stroke="#F57F17" stroke-width="1"/>
  </g>

  <!-- Rescuer with long dry wooden broom/stick on left standing at safe distance -->
  <g transform="translate(40, 50)">
    <!-- Head -->
    <ellipse cx="50" cy="45" rx="16" ry="18" fill="#FFE0B2"/>
    <path d="M 35 40 C 35 25 55 22 65 30 C 65 40 45 42 35 40 Z" fill="#37474F"/>
    <!-- Body -->
    <path d="M 35 65 C 35 65 25 120 30 150 L 70 150 C 75 120 65 65 65 65 Z" fill="#42A5F5"/>
    <!-- Legs -->
    <rect x="35" y="150" width="12" height="65" fill="#455A64"/>
    <rect x="53" y="150" width="12" height="65" fill="#455A64"/>
    <ellipse cx="40" cy="215" rx="10" ry="5" fill="#263238"/>
    <ellipse cx="60" cy="215" rx="10" ry="5" fill="#263238"/>
    
    <!-- Rescuer Arms holding long dry wooden stick -->
    <path d="M 45 75 L 85 95" stroke="#FFE0B2" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Long DRY Wooden Stick pushing the wire away safely -->
    <line x1="75" y1="88" x2="230" y2="160" stroke="#8D6E63" stroke-width="7" stroke-linecap="round"/>
    <line x1="75" y1="88" x2="230" y2="160" stroke="#A1887F" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Safe distance arrow -->
    <path d="M 90 195 L 180 195" stroke="#2E7D32" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="185,195 178,191 178,199" fill="#2E7D32"/>
  </g>

  <rect x="20" y="18" width="220" height="26" rx="13" fill="#FFF3E0"/>
  <text x="130" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E65100" text-anchor="middle">Push Wire with Dry Wooden Stick</text>
</svg>
