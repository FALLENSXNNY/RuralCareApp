<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="210" cy="265" rx="140" ry="14" fill="#ECEFF1"/>
  
  <!-- Wall backdrop support -->
  <path d="M 90 40 L 90 270 L 120 270 L 120 40 Z" fill="#E0E0E0"/>
  <rect x="70" y="30" width="40" height="240" fill="#CFD8DC"/>
  <path d="M 110 120 C 110 120 130 160 140 210 L 105 210 Z" fill="#B0BEC5"/> <!-- Pillow behind back -->

  <g transform="translate(40, 20)">
    <!-- Head and hair -->
    <path d="M 115 65 C 115 45 135 35 155 35 C 175 35 185 48 185 68 C 185 85 170 98 150 98 C 130 98 115 85 115 65 Z" fill="#FFE0B2"/>
    <path d="M 115 55 C 120 38 145 32 165 32 C 180 32 188 42 185 55 C 175 48 155 46 140 54 C 130 60 125 72 120 78 Z" fill="#455A64"/>
    
    <!-- Face details (calm, leaning back) -->
    <circle cx="162" cy="62" r="2.5" fill="#78909C"/>
    <path d="M 160 75 Q 168 76 172 73" stroke="#78909C" stroke-width="2" fill="none"/>
    
    <!-- Torso upright leaning at 75-80 degrees -->
    <path d="M 125 95 C 125 95 105 150 115 205 L 175 205 C 185 165 175 110 165 95 Z" fill="#42A5F5"/>
    <!-- Unbuttoned / loosened collar -->
    <path d="M 145 95 L 155 120 L 165 95" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    
    <!-- Arms resting supported -->
    <path d="M 130 115 Q 150 145 175 160 L 185 150 Q 165 130 145 110 Z" fill="#90CAF9"/>
    
    <!-- Legs bent at knees (W-sitting posture) -->
    <path d="M 165 200 Q 210 195 240 160 L 255 175 Q 220 220 165 220 Z" fill="#546E7A"/>
    <path d="M 240 160 L 255 245 L 235 245 L 225 180 Z" fill="#455A64"/>
    <ellipse cx="245" cy="245" rx="18" ry="8" fill="#37474F"/>
    
    <!-- Support angle / posture indicator -->
    <path d="M 85 130 Q 100 130 105 145" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  
  <rect x="20" y="18" width="170" height="26" rx="13" fill="#E8F5E9"/>
  <text x="105" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2E7D32" text-anchor="middle">Upright 'W' Sitting Posture</text>
</svg>
