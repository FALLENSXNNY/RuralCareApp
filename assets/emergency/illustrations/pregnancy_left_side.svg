<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="200" cy="265" rx="160" ry="16" fill="#ECEFF1"/>

  <!-- Bed/Mat -->
  <path d="M 30 220 L 370 220 L 360 250 L 20 250 Z" fill="#CFD8DC"/>
  <!-- Pillow under head -->
  <ellipse cx="80" cy="180" rx="35" ry="15" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="2"/>
  
  <g transform="translate(40, 40)">
    <!-- Pregnant Woman lying on left side -->
    <!-- Head -->
    <ellipse cx="50" cy="135" rx="22" ry="20" fill="#FFE0B2"/>
    <!-- Hair -->
    <path d="M 28 135 C 28 110 45 105 65 105 C 75 105 80 115 78 130 C 65 125 45 125 35 140 Z" fill="#4E342E"/>
    
    <!-- Face -->
    <path d="M 58 135 Q 64 140 70 135" stroke="#8D6E63" stroke-width="1.5" fill="none"/>
    
    <!-- Upper Body / Pink maternity dress -->
    <path d="M 68 145 C 80 135 110 135 130 145 C 135 155 130 175 120 185 L 68 185 Z" fill="#F48FB1"/>
    
    <!-- Pregnant Belly contour (well supported) -->
    <path d="M 110 145 C 135 145 155 165 155 185 C 155 200 135 210 115 205 Z" fill="#F06292"/>
    
    <!-- Left Arm resting forward on pillow/bed -->
    <path d="M 75 155 Q 95 165 115 170" stroke="#FFE0B2" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Hips & Leg bent (Left Lateral Position) -->
    <path d="M 120 185 C 150 185 185 175 220 180 L 225 198 C 185 205 150 205 120 205 Z" fill="#CE93D8"/>
    <!-- Top leg bent forward -->
    <path d="M 180 185 Q 215 175 235 200 L 250 215 L 230 220 Q 205 195 175 195 Z" fill="#BA68C8"/>
    
    <!-- Pillow between knees for pelvic alignment & comfort -->
    <ellipse cx="215" cy="195" rx="20" ry="10" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1.5"/>
    
    <!-- Blood Flow Indicator Arrow to Placenta -->
    <path d="M 110 110 Q 130 115 135 135" stroke="#E91E63" stroke-width="3" fill="none" stroke-dasharray="4,3"/>
    <polygon points="135,140 130,130 140,130" fill="#E91E63"/>
    
    <!-- Left side badge -->
    <rect x="80" y="80" width="105" height="22" rx="11" fill="#FCE4EC"/>
    <text x="132" y="95" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Left Lateral Side</text>
  </g>

  <rect x="20" y="18" width="165" height="26" rx="13" fill="#FCE4EC"/>
  <text x="102" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C2185B" text-anchor="middle">Rest on Left Side (L-Position)</text>
</svg>
