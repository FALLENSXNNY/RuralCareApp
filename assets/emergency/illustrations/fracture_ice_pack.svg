<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <ellipse cx="200" cy="265" rx="150" ry="15" fill="#ECEFF1"/>

  <g transform="translate(40, 50)">
    <!-- Resting injured leg/ankle supported on pillow -->
    <!-- Soft Support Pillow -->
    <path d="M 60 160 C 40 160 30 185 50 195 L 250 195 C 270 185 260 160 240 160 Z" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>
    
    <!-- Lower Leg & Foot -->
    <path d="M 20 145 C 70 145 120 140 170 148 C 200 152 230 165 250 150 L 265 175 C 235 190 200 175 165 170 C 115 165 65 168 20 168 Z" fill="#FFE0B2"/>
    
    <!-- Ankle swelling indicator -->
    <ellipse cx="190" cy="155" rx="22" ry="12" fill="#FFCDD2" opacity="0.6"/>
    
    <!-- Ice pack wrapped in soft towel -->
    <g transform="translate(145, 80)">
      <!-- Soft Towel wrap -->
      <rect x="0" y="30" width="85" height="42" rx="10" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
      
      <!-- Ice Bag inside with closure clip -->
      <path d="M 15 30 C 15 15 30 10 42 10 C 55 10 70 15 70 30 Z" fill="#81D4FA" stroke="#0288D1" stroke-width="2"/>
      <rect x="36" y="5" width="14" height="8" rx="2" fill="#0288D1"/>
      
      <!-- Ice Cubes Pattern -->
      <rect x="25" y="16" width="10" height="8" rx="2" fill="#E1F5FE" opacity="0.8"/>
      <rect x="45" y="18" width="10" height="8" rx="2" fill="#E1F5FE" opacity="0.8"/>
      
      <!-- Cold frost / coolness rays -->
      <line x1="10" y1="20" x2="0" y2="15" stroke="#29B6F6" stroke-width="2" stroke-linecap="round"/>
      <line x1="75" y1="20" x2="85" y2="15" stroke="#29B6F6" stroke-width="2" stroke-linecap="round"/>
      <line x1="42" y1="0" x2="42" y2="-8" stroke="#29B6F6" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Hand gently holding the ice pack in place -->
    <path d="M 120 70 C 135 65 150 70 160 85 L 148 105 C 140 95 130 90 120 95 Z" fill="#FFCC80"/>
  </g>

  <rect x="20" y="18" width="190" height="26" rx="13" fill="#E1F5FE"/>
  <text x="115" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0288D1" text-anchor="middle">Ice Pack Wrapped in Cloth</text>
</svg>
