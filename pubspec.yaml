name: ruralcare
description: "RuralCare — AI-assisted healthcare access for rural and underserved communities in India."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.2

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1

  # Fonts
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.3.3

  # Connectivity
  connectivity_plus: ^6.1.4

  # Launch URLs / phone calls
  url_launcher: ^6.3.1

  # Location & GPS
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  # Required to enable Hybrid Composition rendering mode for multi-touch
  google_maps_flutter_android: ^2.14.13
  google_maps_flutter_platform_interface: ^2.7.3

  # Image caching
  cached_network_image: ^3.4.1

  # SVG support
  flutter_svg: ^2.0.10+1

  # Animations
  lottie: ^3.1.3

  # Intl / date formatting
  intl: ^0.20.2

  # HTTP client
  http: ^1.2.2
  flutter_markdown: ^0.7.7+1
  image_picker: ^1.2.3
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/emergency/
    - assets/images/
    - assets/icons/
    - assets/mock/
